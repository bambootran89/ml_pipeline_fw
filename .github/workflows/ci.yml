name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements/prod.txt
        pip install -r requirements/dev.txt
        pip install -e .[dev]

    - name: Lint and Format (make style)
      run: |
        make style

    - name: Run Tests (make test)
      run: |
        make test

  docker-build:
    runs-on: ubuntu-latest
    needs: test-and-lint
    steps:
    - uses: actions/checkout@v4

    - name: Build Train Image
      run: docker build -f Dockerfile.train -t mlproject-train:latest .

    - name: Build Serve Image
      run: docker build -f Dockerfile.serve -t mlproject-serve:latest .
